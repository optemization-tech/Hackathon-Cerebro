<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>cerebro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-paper: #F7F4EF;
    --bg-paper-deep: #EFEAE0;
    --ink: #1A1A1A;
    --ink-soft: #4A4A48;
    --ink-muted: #8A857C;
    --accent: #4E5FFD;
    --accent-ink: #2D3AC9;
    --rule: #DDD6C7;
    --src-slack: #611f69;
    --src-granola: #E8722C;
    --src-gmail: #D14836;
    --src-circleback: #16A085;
    --src-gcal: #4285F4;
    --src-notion: #1A1A1A;
    --serif: 'Fraunces', Georgia, serif;
    --sans: 'Inter', system-ui, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
    --shadow-soft: 0 30px 60px -30px rgba(26,26,26,0.18), 0 18px 36px -18px rgba(26,26,26,0.10);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--bg-paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.55;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* ─── top bar ─── */
  .topbar {
    height: 56px;
    border-bottom: 1px solid var(--rule);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 32px;
    position: sticky;
    top: 0;
    background: var(--bg-paper);
    z-index: 100;
    position: sticky;
  }
  .topbar::after {
    content: '';
    position: absolute;
    left: 32px;
    bottom: -1px;
    width: 64px;
    height: 1px;
    background: var(--accent);
  }
  .wordmark {
    font-family: var(--mono);
    font-size: 14px;
    color: var(--ink);
    cursor: pointer;
    user-select: none;
    letter-spacing: 0.02em;
  }
  .wordmark .mark { color: var(--accent); margin-right: 4px; }
  .wordmark:hover { color: var(--accent); }
  .topbar-left {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .back-btn {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.04em;
    color: var(--ink-soft);
    background: transparent;
    border: 1px solid var(--rule);
    border-radius: 6px;
    padding: 5px 10px;
    cursor: pointer;
    user-select: none;
    transition: color 150ms, border-color 150ms;
  }
  .back-btn[hidden] { display: none; }
  .back-btn:hover {
    color: var(--accent);
    border-color: var(--accent);
  }
  .user-pill {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: var(--mono);
    font-size: 13px;
    color: var(--ink-soft);
    cursor: pointer;
  }
  .user-pill:hover { color: var(--ink); }
  .avatar-circle {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--accent);
    color: var(--bg-paper);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-family: var(--mono);
    font-weight: 500;
  }

  /* ─── main container ─── */
  main { min-height: calc(100vh - 56px); }

  /* ─── home view ─── */
  .home {
    min-height: calc(100vh - 56px);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 80px 32px;
    animation: fadein 200ms ease;
  }
  .home-inner { width: 100%; max-width: 720px; }
  .headline-row {
    display: flex;
    align-items: center;
    gap: 24px;
    margin-bottom: 40px;
  }
  .cerebro-mark {
    width: 96px;
    height: 96px;
    flex-shrink: 0;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    user-select: none;
    /* PNG has a white background, not transparent — multiply makes white blend
       into the cream paper bg while keeping the blue pixels intact. */
    mix-blend-mode: multiply;
  }
  /* Voice-only "speech bubble" — concentric pulse rings around the cerebro mark. */
  .voice-pulse {
    position: relative;
    width: 280px;
    height: 280px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .voice-pulse .ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 1px solid var(--accent);
    opacity: 0;
    animation: voice-ring 2.6s ease-out infinite;
  }
  .voice-pulse .ring-2 { animation-delay: 0.65s; }
  .voice-pulse .ring-3 { animation-delay: 1.3s; }
  .voice-pulse .core {
    width: 140px;
    height: 140px;
    border-radius: 50%;
    background: var(--bg-paper-deep);
    box-shadow: var(--shadow-soft), 0 0 0 1px var(--rule);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    z-index: 1;
    overflow: hidden;
  }
  .cerebro-mark-bubble {
    width: 96px;
    height: 96px;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    mix-blend-mode: multiply;
    user-select: none;
  }
  @keyframes voice-ring {
    0%   { transform: scale(0.5); opacity: 0; }
    20%  { opacity: 0.45; }
    100% { transform: scale(1.05); opacity: 0; }
  }
  .prompt-headline {
    font-family: var(--serif);
    font-size: 56px;
    font-weight: 400;
    line-height: 1.05;
    letter-spacing: -0.02em;
    color: var(--ink);
    margin: 0;
  }
  .prompt-headline em {
    font-style: italic;
    color: var(--accent);
  }
  .prompt-input-wrap {
    border-bottom: 1px solid var(--rule);
    padding-bottom: 14px;
    margin-bottom: 24px;
    transition: border-color 200ms, box-shadow 300ms;
    position: relative;
  }
  .prompt-input-wrap::after {
    content: '';
    position: absolute;
    left: 0;
    bottom: -1px;
    width: 0;
    height: 1px;
    background: var(--accent);
    transition: width 300ms ease;
  }
  .prompt-input-wrap:focus-within::after { width: 100%; }
  .prompt-input-wrap:focus-within {
    box-shadow: 0 8px 32px -16px rgba(78, 95, 253, 0.25);
  }
  .prompt-input {
    width: 100%;
    border: none;
    outline: none;
    background: transparent;
    font-family: var(--serif);
    font-size: 22px;
    font-style: italic;
    color: var(--ink);
    caret-color: var(--accent);
  }
  .prompt-input::placeholder { color: var(--ink-muted); }
  .followup-wrap { margin: 16px 0 8px; max-width: 720px; }
  .followup-wrap .prompt-input { font-size: 20px; padding: 6px 0; }

  .affordances {
    display: flex;
    gap: 12px;
    margin-bottom: 96px;
  }
  .affordance {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--ink-muted);
    padding: 8px 14px;
    border: 1px solid var(--ink-muted);
    border-radius: 6px;
    background: transparent;
    cursor: pointer;
    transition: all 200ms;
    user-select: none;
  }
  .affordance:hover {
    color: var(--ink);
    border-color: var(--ink);
  }
  .affordance.primary {
    background: var(--accent);
    color: var(--bg-paper);
    border-color: var(--accent);
  }
  .affordance.primary:hover {
    background: var(--accent-ink);
    border-color: var(--accent-ink);
    color: var(--bg-paper);
  }

  .eyebrow {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--ink-muted);
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .eyebrow .count { color: var(--accent); }

  .recent-list { display: flex; flex-direction: column; }
  .recent-item {
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding: 10px 0;
    border-bottom: 1px solid transparent;
    cursor: pointer;
    color: var(--ink-soft);
    font-size: 15px;
    transition: all 150ms;
    position: relative;
  }
  .recent-item:hover {
    color: var(--ink);
    border-bottom-color: var(--accent);
    padding-left: 12px;
  }
  .recent-item::before {
    content: '›';
    position: absolute;
    left: 0;
    font-family: var(--mono);
    color: var(--accent);
    opacity: 0;
    transition: opacity 150ms;
  }
  .recent-item:hover::before { opacity: 1; }
  .recent-item .bullet {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.05em;
    color: var(--accent);
    min-width: 80px;
    transition: color 150ms;
  }
  .recent-item:hover .bullet { color: var(--accent-ink); }
  .recent-empty {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--ink-muted);
    padding: 12px 0;
  }
  .recent-item .q { flex: 1; }
  .recent-item .ts {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--ink-muted);
  }

  /* ─── answered view ─── */
  .answered {
    padding: 48px 32px 96px;
    max-width: 760px;
    margin: 0 auto;
    animation: fadein 200ms ease;
  }
  .breadcrumb {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--ink-muted);
    margin-bottom: 40px;
  }
  .breadcrumb .crumb-home { color: var(--ink-soft); cursor: pointer; transition: color 150ms; }
  .breadcrumb .crumb-home .mark { color: var(--accent); }
  .breadcrumb .crumb-home:hover { color: var(--accent); }
  .breadcrumb .question { color: var(--ink); }
  .breadcrumb .sep { margin: 0 8px; color: var(--accent); }
  .answer-prose,
  .chat-answer {
    font-family: var(--serif);
    font-size: 19px;
    line-height: 1.55;
    color: var(--ink);
    max-width: 640px;
  }
  .answer-prose p,
  .chat-answer p { margin-bottom: 1em; }
  .chat-thread {
    display: flex;
    flex-direction: column;
    gap: 28px;
  }
  .chat-turn {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .chat-question {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--ink-soft);
    letter-spacing: 0.02em;
    padding-top: 8px;
    border-top: 1px dashed var(--rule);
  }
  .answer-prose .claim-ref {
    color: var(--accent);
    font-weight: 500;
    cursor: pointer;
    transition: all 150ms;
    padding: 0 2px;
    border-radius: 3px;
  }
  .answer-prose .claim-ref:hover {
    background: rgba(78, 95, 253, 0.12);
    color: var(--accent-ink);
  }
  .answer-prose .claim-ref.active {
    background: rgba(78, 95, 253, 0.18);
    color: var(--accent-ink);
  }
  .cursor {
    display: inline-block;
    width: 9px;
    height: 20px;
    background: var(--accent);
    vertical-align: text-bottom;
    margin-left: 2px;
    animation: blink 1s steps(2, end) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .answer-footer {
    margin-top: 32px;
    max-width: 640px;
  }
  .ascii-rule {
    font-family: var(--mono);
    color: var(--ink-muted);
    font-size: 13px;
    margin-bottom: 16px;
    user-select: none;
  }
  .answer-actions {
    display: flex;
    gap: 24px;
    font-family: var(--mono);
    font-size: 13px;
  }
  .answer-actions a {
    color: var(--accent);
    text-decoration: none;
    cursor: pointer;
    transition: color 150ms;
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .answer-actions a .glyph {
    transition: transform 200ms ease;
    display: inline-block;
  }
  .answer-actions a:hover {
    color: var(--accent-ink);
  }
  .answer-actions a:hover .glyph {
    transform: translateX(2px);
  }

  /* ─── citation rail ─── */
  .citation-rail {
    display: flex;
    flex-direction: column;
  }
  .citation-rail .eyebrow { margin-bottom: 24px; }
  .citations {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .citation-card {
    position: relative;
    border-left: 3px solid var(--src-default, var(--ink));
    background: var(--bg-paper);
    border-radius: 0 8px 8px 0;
    padding: 0;
    cursor: pointer;
    transition: transform 200ms, box-shadow 200ms, background 200ms;
    font-family: var(--mono);
  }
  .citation-card:hover {
    transform: translateY(-1px);
    box-shadow: var(--shadow-soft);
  }
  .citation-card.active {
    transform: translateY(-1px);
    box-shadow: 0 30px 60px -30px rgba(78, 95, 253, 0.35), 0 18px 36px -18px rgba(78, 95, 253, 0.20);
    background: rgba(78, 95, 253, 0.04);
  }
  .citation-card.active .frame-top,
  .citation-card.active .frame-bot {
    color: var(--accent);
  }
  .citation-card.active .frame-mid {
    border-color: var(--accent);
  }
  .citation-card.active .src-num {
    color: var(--accent);
  }
  .citation-card .frame-top,
  .citation-card .frame-bot {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-muted);
    padding: 0 12px;
    user-select: none;
    letter-spacing: -0.05em;
    overflow: hidden;
    white-space: nowrap;
  }
  .citation-card .frame-mid {
    border-left: 1px solid var(--ink-muted);
    border-right: 1px solid var(--ink-muted);
    padding: 12px 16px;
  }
  .citation-card .src-head {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }
  .citation-card .src-name {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink);
  }
  .citation-card .src-num {
    font-family: var(--mono);
    font-size: 14px;
    color: var(--accent);
    font-weight: 500;
    transition: color 150ms;
  }
  .citation-card .src-ts {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-muted);
    margin-left: auto;
  }
  .citation-card .snippet {
    font-family: var(--sans);
    font-size: 13px;
    color: var(--ink-soft);
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .citation-card[data-src="slack"] { --src-default: var(--src-slack); }
  .citation-card[data-src="granola"] { --src-default: var(--src-granola); }
  .citation-card[data-src="gmail"] { --src-default: var(--src-gmail); }
  .citation-card[data-src="circleback"] { --src-default: var(--src-circleback); }
  .citation-card[data-src="gcal"] { --src-default: var(--src-gcal); }
  .citation-card[data-src="notion"] { --src-default: var(--src-notion); }

  /* ─── review affordance with queue pill ─── */
  .affordance.review-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .queue-pill {
    background: var(--accent);
    color: var(--bg-paper);
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 500;
    padding: 2px 7px;
    border-radius: 10px;
    line-height: 1.3;
    min-width: 20px;
    text-align: center;
  }
  .affordance.review-btn:hover .queue-pill {
    background: var(--accent-ink);
  }

  /* ─── review deck view ─── */
  .review-view {
    height: calc(100vh - 56px);
    display: flex;
    flex-direction: column;
    padding: 24px 32px 48px;
    animation: fadein 200ms ease;
    position: relative;
  }
  .review-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 16px;
  }
  .review-title {
    font-family: var(--serif);
    font-size: 28px;
    line-height: 1.1;
    color: var(--ink);
    letter-spacing: -0.01em;
  }
  .review-subtitle {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--ink-muted);
    margin-top: 6px;
    letter-spacing: 0.05em;
  }
  .session-stats {
    display: flex;
    gap: 24px;
    font-family: var(--mono);
    font-size: 13px;
  }
  .stat-block {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--ink-soft);
  }
  .stat-block .stat-icon { color: var(--accent); font-weight: 500; }
  .stat-block.kept .stat-icon { color: var(--accent); }
  .stat-block.archived .stat-icon { color: var(--ink-muted); }
  .stat-block .stat-num { color: var(--ink); font-weight: 500; font-size: 16px; }

  .deck-stage {
    flex: 1;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    perspective: 1200px;
  }
  .deck-card {
    position: absolute;
    width: min(520px, 92vw);
    background: var(--bg-paper);
    border: 1px solid var(--rule);
    border-radius: 16px;
    padding: 0;
    box-shadow: var(--shadow-soft);
    cursor: grab;
    user-select: none;
    overflow: hidden;
    transition: transform 600ms cubic-bezier(0.32, 0.72, 0.35, 1), opacity 600ms ease-out;
    will-change: transform;
  }
  .deck-card.dragging {
    transition: none;
    cursor: grabbing;
  }
  .deck-card.gone-right {
    transform: translateX(150vw) rotate(20deg) !important;
    opacity: 0;
  }
  .deck-card.gone-left {
    transform: translateX(-150vw) rotate(-20deg) !important;
    opacity: 0;
  }
  .deck-card .card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 24px 14px;
    border-bottom: 1px solid var(--rule);
  }
  .deck-card .card-type {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.18em;
    font-weight: 600;
    text-transform: uppercase;
    padding: 4px 10px;
    border-radius: 999px;
    color: #fff;
    background: var(--type-bg, var(--ink));
    border: 1px solid var(--type-border, transparent);
    box-shadow: 0 1px 2px rgba(26,26,26,0.08);
  }
  .deck-card[data-type="DECISION"]  .card-type { --type-bg: #4E5FFD; --type-border: #2D3AC9; }
  .deck-card[data-type="INSIGHT"]   .card-type { --type-bg: #E8722C; --type-border: #B0541A; }
  .deck-card[data-type="PATTERN"]   .card-type { --type-bg: #16A085; --type-border: #0F7A66; }
  .deck-card[data-type="FRAMEWORK"] .card-type { --type-bg: #6B7280; --type-border: #4B5563; }
  .deck-card[data-type="STRATEGY"]  .card-type { --type-bg: #9333EA; --type-border: #6B21A8; }
  .deck-card[data-type="SIGNAL"]    .card-type { --type-bg: #D14836; --type-border: #A8341F; }
  .deck-card .card-num {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-muted);
    letter-spacing: 0.05em;
  }
  .deck-card .card-body {
    padding: 28px 28px 24px;
  }
  .deck-card .card-title {
    font-family: var(--serif);
    font-size: 24px;
    line-height: 1.25;
    color: var(--ink);
    margin-bottom: 16px;
    letter-spacing: -0.01em;
  }
  .deck-card .card-statement {
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.55;
    color: var(--ink-soft);
    margin-bottom: 24px;
  }
  .deck-card .card-meta {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 6px 16px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-muted);
    padding-top: 16px;
    border-top: 1px solid var(--rule);
    letter-spacing: 0.04em;
  }
  .deck-card .card-meta .key { color: var(--accent); text-transform: uppercase; letter-spacing: 0.12em; }
  .deck-card .card-meta .val { color: var(--ink-soft); }
  .deck-card .card-sources {
    margin-top: 14px;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--ink-muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .deck-card .card-sources .src-tag {
    display: inline-block;
    margin-right: 10px;
    padding: 3px 8px;
    border: 1px solid var(--rule);
    border-radius: 4px;
    margin-bottom: 4px;
  }

  .deck-card .swipe-indicator {
    position: absolute;
    top: 24px;
    padding: 6px 14px;
    border-radius: 4px;
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.15em;
    font-weight: 500;
    text-transform: uppercase;
    border: 2px solid;
    opacity: 0;
    transition: opacity 100ms;
    pointer-events: none;
  }
  .deck-card .swipe-indicator.verify {
    right: 24px;
    color: var(--accent);
    border-color: var(--accent);
    transform: rotate(8deg);
  }
  .deck-card .swipe-indicator.archive {
    left: 24px;
    color: #E63946;

/* ─── graph data transformation ─── */
function parseEntityTags(str) {
  const tags = {};
  const names = [];
  for (const part of (str || "").split(",").map(s => s.trim()).filter(Boolean)) {
    const ci = part.indexOf(":");
    if (ci > 0 && !part.includes(" ")) tags[part.slice(0, ci)] = part.slice(ci + 1);
    else names.push(part);
  }
  return { tags, names };
}

function firstSentence(text) {
  if (!text) return "";
  const pipe = text.indexOf(" | ");
  const chunk = pipe > 0 ? text.slice(0, pipe) : text;
  const dot = chunk.indexOf(". ");
  const s = dot > 0 ? chunk.slice(0, dot + 1) : chunk;
  return s.length > 120 ? s.slice(0, 117) + "..." : s;
}

const KNOWN_PEOPLE = new Set(["tem", "rick", "natalie", "kamau", "mike", "chris", "rc"]);
const TYPE_LABELS = {
  decision: "Decisions", insight: "Insights", signal: "Signals",
  pattern: "Patterns", strategy: "Strategies", framework: "Frameworks"
};

function transformHindsightGraph(raw) {
  if (!raw || !raw.nodes || !raw.edges) return null;

  const factMap = new Map();
  for (const n of raw.nodes) {
    const d = n.data;
    const { tags, names } = parseEntityTags(d.entities);
    factMap.set(d.id, { id: d.id, text: d.text, date: d.date, context: d.context, tags, names, unitType: tags.unit_type });
  }

  const entityNodes = new Map();
  for (const e of raw.edges) {
    if (e.data.linkType === "entity" && e.data.entityName) {
      const name = e.data.entityName;
      const key = name.toLowerCase().replace(/[^a-z0-9]+/g, "-").slice(0, 40);
      if (!entityNodes.has(key)) {
        const isPerson = KNOWN_PEOPLE.has(name.toLowerCase());
        entityNodes.set(key, { id: "ent-" + key, type: isPerson ? "person" : "company", label: name, connections: new Set(), facts: [] });
      }
      entityNodes.get(key).connections.add(e.data.source);
      entityNodes.get(key).connections.add(e.data.target);
    }
  }

  const typeNodes = new Map();
  for (const [fid, fact] of factMap) {
    const ut = fact.unitType;
    if (!ut || !TYPE_LABELS[ut]) continue;
    const label = firstSentence(fact.text) || ut;
    const id = ut + "-" + fid.slice(0, 12);
    typeNodes.set(fid, { id, type: ut, label, factId: fid, facts: [fact], connections: new Set(), date: fact.date });
  }

  for (const e of raw.edges) {
    const sn = typeNodes.get(e.data.source);
    const tn = typeNodes.get(e.data.target);
    if (sn) sn.connections.add(e.data.target);
    if (tn) tn.connections.add(e.data.source);
  }

  const visualNodes = [];

  const allEntities = [...entityNodes.values()];
  for (const en of allEntities) {
    en.factCount = en.connections.size;
    for (const fid of en.connections) { const f = factMap.get(fid); if (f) en.facts.push(f); }
    en.facts = en.facts.slice(0, 15);
  }
  allEntities.sort((a, b) => b.factCount - a.factCount);
  const entityCut = Math.ceil(allEntities.length * 0.4);
  for (const en of allEntities.slice(0, entityCut)) visualNodes.push(en);

  const typeBuckets = new Map();
  for (const [, tn] of typeNodes) {
    tn.factCount = tn.connections.size;
    if (!typeBuckets.has(tn.type)) typeBuckets.set(tn.type, []);
    typeBuckets.get(tn.type).push(tn);
  }
  for (const [type, bucket] of typeBuckets) {
    bucket.sort((a, b) => b.factCount - a.factCount);
    const top = bucket.slice(0, Math.ceil(bucket.length * 0.4));
    for (const tn of top) visualNodes.push(tn);
  }

  const nodeIds = new Set(visualNodes.map(n => n.id));
  const factToNode = new Map();
  for (const [, tn] of typeNodes) { if (nodeIds.has(tn.id)) factToNode.set(tn.factId, tn.id); }
  for (const [, en] of entityNodes) { if (nodeIds.has(en.id)) { for (const fid of en.connections) { if (!factToNode.has(fid)) factToNode.set(fid, en.id); } } }

  const edgeMap = new Map();
  for (const e of raw.edges) {
    const sv = factToNode.get(e.data.source);
    const tv = factToNode.get(e.data.target);
    if (!sv || !tv || sv === tv) continue;
    const key = sv < tv ? sv + "|" + tv : tv + "|" + sv;
    if (!edgeMap.has(key)) edgeMap.set(key, { source: sv, target: tv, count: 0 });
    edgeMap.get(key).count++;
  }

  const rawEdges = [...edgeMap.values()].sort((a, b) => b.count - a.count);
  const maxC = rawEdges.length > 0 ? rawEdges[0].count : 1;
  const visualEdges = rawEdges.slice(0, 150).map(e => ({ ...e, strength: Math.pow(e.count / maxC, 0.35) }));

  return { nodes: visualNodes, edges: visualEdges, rawNodeCount: raw.nodes.length, rawEdgeCount: raw.edges.length };
}

function setState(patch) {
  const prevMode = state.mode;
  state = { ...state, ...patch };
  if (prevMode !== state.mode) {
    if (prevMode === "answered" || prevMode === "speak") {
      window.CerebroEL?.endActive?.();
    }
    if (prevMode === "avatar") {
      window.CerebroAvatar?.stop?.();
    }
  }
  render();
}

function goHome() { setState({ mode: "home", question: "", activeCitation: null, graphFocus: null }); }

document.addEventListener("keydown", e => {
  if (e.key === "Escape") goHome();
});

/* ─── render ─── */
function render() {
  const main = document.getElementById("main");
  const backBtn = document.getElementById("back-btn");
  if (backBtn) backBtn.hidden = state.mode === "home";
  if (state.mode === "home") { main.innerHTML = renderHome(); mountHome(); }
  else if (state.mode === "answered") { main.innerHTML = renderAnswered(); mountAnswered(); }
  else if (state.mode === "graph") { main.innerHTML = renderGraph(); mountGraph(); }
  else if (state.mode === "speak") { main.innerHTML = renderSpeak(); mountSpeak(); }
  else if (state.mode === "avatar") { main.innerHTML = renderAvatar(); mountAvatar(); }
  else if (state.mode === "review") { main.innerHTML = renderReview(); mountReview(); }
}

/* ─── home feed (live cards from /api/deck, 5-at-a-time infinite scroll) ─── */
const FEED_PAGE_SIZE = 5;
let feedCards = [];
let feedVisible = 0;
let feedLoading = false;
let feedFetched = false;
let feedObserver = null;

function escapeAttr(s) {
  return String(s).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}
function escapeText(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function renderFeedItem(card) {
  const q = escapeAttr(card.title);
  return `
    <div class="recent-item" onclick="askQuestion('${q}')">
      <span class="bullet">${escapeText(card.type)}</span>
      <span class="q">${escapeText(card.title)}</span>
      <span class="ts">${escapeText(card.meta?.when || "")}</span>
    </div>
  `;
}

function appendFeedPage() {
  if (feedLoading) return;
  const list = document.getElementById("recent-list");
  const sentinel = document.getElementById("feed-sentinel");
  if (!list || !sentinel) return;
  feedLoading = true;
  const next = feedCards.slice(feedVisible, feedVisible + FEED_PAGE_SIZE);
  if (next.length === 0) {
    if (feedObserver) feedObserver.unobserve(sentinel);
    if (feedVisible === 0) {
      const empty = document.getElementById("recent-empty");
      if (empty) empty.textContent = "no records yet — connect your Notion DBs in .env.local";
    }
    feedLoading = false;
    return;
  }
  const wrap = document.createElement("div");
  wrap.innerHTML = next.map(renderFeedItem).join("");
  while (wrap.firstChild) list.insertBefore(wrap.firstChild, sentinel);
  feedVisible += next.length;
  feedLoading = false;
}

async function mountHome() {
  const empty = document.getElementById("recent-empty");
  if (!feedFetched) {
    try {
      const r = await fetch("/api/deck");
      if (r.ok) {
        const data = await r.json();
        feedCards = Array.isArray(data.cards) ? data.cards : [];
      }
    } catch (e) {
      console.error("[feed] load failed:", e);
    }
    feedFetched = true;
  }
  feedVisible = 0;
  // Clear any existing rendered items (defensive in case of re-mount).
  const list = document.getElementById("recent-list");
  if (list) {
    list.querySelectorAll(".recent-item").forEach((el) => el.remove());
  }
  if (empty) {
    empty.textContent = feedCards.length === 0 ? "no records yet — connect your Notion DBs in .env.local" : "";
    empty.style.display = feedCards.length === 0 ? "" : "none";
  }
  appendFeedPage();
  const sentinel = document.getElementById("feed-sentinel");
  if (sentinel) {
    if (feedObserver) feedObserver.disconnect();
    feedObserver = new IntersectionObserver((entries) => {
      for (const e of entries) if (e.isIntersecting) appendFeedPage();
    }, { rootMargin: "200px" });
    feedObserver.observe(sentinel);
  }
}

/* ─── answered (chat thread) ─── */
function answerToHtml(text) {
  return "<p>" + text.replace(/\n\n/g, "</p><p>").replace(/\n/g, "<br>") + "</p>";
}

function renderAnswered() {
  if (!state.turns || state.turns.length === 0) {
    state.turns = [{ question: state.question, answer: "", done: false }];
  }
  const turns = state.turns;
  const lastIdx = turns.length - 1;
  const topic = turns[0].question;

  const turnsHtml = turns.map((t, i) => {
    const isLast = i === lastIdx;
    const showCursor = isLast && !t.done;
    const proseHtml = t.answer
      ? answerToHtml(t.answer)
      : "";
    return `
      <div class="chat-turn" data-idx="${i}">
        ${i > 0 ? '<div class="chat-question">› ' + t.question + '</div>' : ''}
        <div class="chat-answer" id="chat-answer-${i}">${proseHtml}${showCursor ? '<span class="cursor"></span>' : ''}</div>
      </div>
    `;
  }).join("");

  return `
    <div class="answered">
      <div class="breadcrumb">
        <span class="crumb-home" onclick="goHome()"><span class="mark">◆</span>cerebro</span>
        <span class="sep">›</span>
        <span class="question">${topic}</span>
      </div>
      <div class="chat-thread">${turnsHtml}</div>
      <div class="prompt-input-wrap followup-wrap">
        <input id="followup-input" class="prompt-input" placeholder="ask a follow-up…" autocomplete="off" />
      </div>
    </div>
  `;
}

function mountAnswered() {
  const followup = document.getElementById("followup-input");

  // Append a new turn on Enter and re-render.
  if (followup) {
    followup.addEventListener("keydown", (e) => {
      if (e.key !== "Enter") return;
      const q = followup.value.trim();
      if (!q) return;
      // Commit any in-progress turn as done so the cursor doesn't linger above.
      state.turns.forEach(t => { t.done = true; });
      state.turns = [...state.turns, { question: q, answer: "", done: false }];
      render();
    });
  }

  const lastIdx = state.turns.length - 1;
  const lastTurn = state.turns[lastIdx];
  const answerEl = document.getElementById(`chat-answer-${lastIdx}`);

  // Already finished (shouldn't normally happen, but be safe).
  if (lastTurn.done) {
    if (followup) followup.focus();
    return;
  }

  const writeStreaming = (text) => {
    answerEl.innerHTML = answerToHtml(text) + '<span class="cursor"></span>';
  };
  const writeFinal = (text) => {
    answerEl.innerHTML = answerToHtml(text || "(no response)");
  };
  const fail = (msg) => {
    answerEl.innerHTML = `<p style="color:#c00">${msg}</p>`;
    lastTurn.done = true;
  };

  writeStreaming("thinking…");
  fetch("/api/chat", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ question: lastTurn.question }),
  })
    .then(r => { if (!r.ok) throw new Error(`${r.status} ${r.statusText}`); return r.json(); })
    .then(data => {
      lastTurn.answer = data.answer || "(no response)";
      writeFinal(lastTurn.answer);
      lastTurn.done = true;
      if (followup) followup.focus();
    })
    .catch(e => fail(e.message));
}

function wireCitationHover() {
  const refMap = { "①": 0, "②": 1, "③": 2, "④": 3 };
  document.querySelectorAll(".claim-ref").forEach(el => {
    const idx = refMap[el.dataset.ref];
    const card = document.querySelector(`.citation-card[data-idx="${idx}"]`);
    if (!card) return;
    el.addEventListener("mouseenter", () => {
      el.classList.add("active");
      card.classList.add("active");
    });
    el.addEventListener("mouseleave", () => {
      el.classList.remove("active");
      card.classList.remove("active");
    });
  });
  document.querySelectorAll(".citation-card").forEach(card => {
    const idx = card.dataset.idx;
    const ref = document.querySelector(`.claim-ref[data-ref="${["①","②","③","④"][idx]}"]`);
    card.addEventListener("mouseenter", () => {
      if (ref) ref.classList.add("active");
    });
    card.addEventListener("mouseleave", () => {
      if (ref) ref.classList.remove("active");
    });
  });
}

function renderEntityPanel(id) {
  if (!id) return `<div class="graph-empty">click a node to inspect</div>`;

  const TYPE_ICONS_PANEL = { person: "👤", company: "🏢", decision: "⚖️", insight: "💡", signal: "📡", pattern: "🔁", strategy: "🎯", framework: "🧩" };

  if (state.graphData) {
    const node = state.graphData.nodes.find(n => n.id === id);
    if (!node) return `<div class="graph-empty">node not found</div>`;

    const grouped = new Map();
    for (const f of (node.facts || [])) {
      const t = f.unitType || f.tags?.unit_type || "general";
      if (!grouped.has(t)) grouped.set(t, []);
      grouped.get(t).push(f);
    }

    let accordionHtml = "";
    for (const [type, facts] of grouped) {
      const icon = TYPE_ICONS_PANEL[type] || "📄";
      const label = TYPE_LABELS[type] || type;
      const items = facts.slice(0, 20).map(f => {
        const date = f.date ? f.date.split("T")[0] : "";
        const fid = f.id || "";
        return `<div class="fact-item" data-fact-id="${fid}">
          <div class="fact-date">${date}</div>
          <div class="fact-text">${firstSentence(f.text)}</div>
        </div>`;
      }).join("");
      accordionHtml += `<details class="accordion-section">
        <summary class="accordion-header"><span>${icon} ${label}</span><span class="accordion-count">${facts.length}</span></summary>
        <div class="accordion-body"><div class="fact-list">${items}</div></div>
      </details>`;
    }

    return `
      <div class="panel-eyebrow">// ${node.type.toUpperCase()}</div>
      <h2 class="entity-name">${node.label}</h2>
      <div class="entity-role">${node.factCount} connected facts</div>
      <div class="ascii-rule">─────────────────────────</div>
      ${accordionHtml || '<div class="graph-empty" style="height:auto;padding:12px 0;">no facts</div>'}
    `;
  }

  const p = ENTITY_PROFILES[id];
  const node = SEED_GRAPH.nodes.find(n => n.id === id);
  if (!p || !node) {
    return `
      <div class="panel-eyebrow">// ${node ? node.type : "unknown"}</div>
      <h2 class="entity-name">${node ? node.label : id}</h2>
      <div class="entity-role">${node ? node.role : ""}</div>
      <div class="ascii-rule">─────────────────────────</div>
      <div class="graph-empty" style="height:auto; padding:20px 0;">no dossier yet</div>
    `;
  }
  return `
    <div class="panel-eyebrow">// ${node.type.toUpperCase()}</div>
    <h2 class="entity-name">${p.label}</h2>
    <div class="entity-role">${p.role}</div>
    <div class="ascii-rule">─────────────────────────</div>
    <div class="entity-stats">
      ${p.stats.map(s => `<div>${s}</div>`).join("")}
    </div>
    <div class="ascii-rule">─────────────────────────</div>
    <div class="panel-eyebrow" style="margin-top:16px;">// RECENT SIGNALS</div>
    <div class="signal-list">
      ${p.signals.map(s => `
        <div class="signal-item">
          <span class="arrow">${s.dir}</span>
          <span>${s.text}</span>
        </div>
      `).join("")}
    </div>
  `;
}

let graphSim = null;

async function mountGraph() {
  if (!state.graphData && !state.graphLoading) {
    state.graphLoading = true;
    render();
    try {
      const r = await fetch("/api/graph");
      if (r.ok) {
        const data = await r.json();
        state.graphData = transformHindsightGraph(data.graph);
      }
    } catch (e) {
      console.error("[graph] fetch failed:", e);
    }
    state.graphLoading = false;
    if (!state.graphData) {
      state.graphData = {
        nodes: SEED_GRAPH.nodes.map(n => ({ id: n.id, type: n.type, label: n.label, factCount: 1, facts: [{ text: n.role || "", date: "" }] })),
        edges: SEED_GRAPH.links.map(l => ({ source: l.s, target: l.t, primaryType: "entity", avgWeight: 1, count: 1, strength: 0.5 })),
        rawNodeCount: SEED_GRAPH.nodes.length, rawEdgeCount: SEED_GRAPH.links.length
      };
    }
    render();
    return;
  }

  if (!state.graphData || typeof d3 === "undefined") return;

  if (graphSim) { graphSim.stop(); graphSim = null; }

  const container = document.getElementById("graph-canvas");
  const svgEl = document.getElementById("graph-svg");
  if (!container || !svgEl) return;

  const W = container.clientWidth || 900;
  const H = container.clientHeight || 600;

  const svg = d3.select(svgEl).attr("viewBox", `0 0 ${W} ${H}`).attr("preserveAspectRatio", "xMidYMid meet");
  svg.selectAll("*").remove();

  svg.append("defs");

  const TYPE_COLORS = {
    person: "#374151", company: "#6b7280", decision: "#6366f1",
    insight: "#8b5cf6", signal: "#10b981", pattern: "#f59e0b",
    strategy: "#ef4444", framework: "#06b6d4"
  };

  const CLUSTER_GROUPS = {
    person: "dossiers", company: "dossiers",
    decision: "actions", project: "actions", task: "actions",
    insight: "intelligence", signal: "intelligence", pattern: "intelligence",
    strategy: "intelligence", framework: "intelligence"
  };
  const GROUP_POSITIONS = {
    dossiers:     { x: 0.18, y: 0.4,  label: "// DOSSIERS" },
    actions:      { x: 0.5,  y: 0.45, label: "// ACTIONS" },
    intelligence: { x: 0.82, y: 0.4,  label: "// INTELLIGENCE" }
  };
  const CLUSTER_POSITIONS = {};
  for (const [type, group] of Object.entries(CLUSTER_GROUPS)) {
    CLUSTER_POSITIONS[type] = GROUP_POSITIONS[group] || GROUP_POSITIONS.actions;
  }

  const af = state.graphFilter;
  const nodes = state.graphData.nodes
    .filter(n => af.size === 0 || af.has(n.type))
    .map(n => {
      const cp = CLUSTER_POSITIONS[n.type] || { x: 0.5, y: 0.5 };
      return { ...n, x: cp.x * W + (Math.random() - 0.5) * 60, y: cp.y * H + (Math.random() - 0.5) * 60 };
    });
  const nodeIds = new Set(nodes.map(n => n.id));
  const edges = state.graphData.edges
    .filter(e => nodeIds.has(typeof e.source === "object" ? e.source.id : e.source) && nodeIds.has(typeof e.target === "object" ? e.target.id : e.target))
    .map(e => ({ source: typeof e.source === "object" ? e.source.id : e.source, target: typeof e.target === "object" ? e.target.id : e.target, count: e.count, strength: e.strength }));

  const g = svg.append("g");
  svg.call(d3.zoom().scaleExtent([0.15, 6]).on("zoom", (ev) => g.attr("transform", ev.transform)));

  Object.entries(GROUP_POSITIONS).forEach(([group, gp]) => {
    g.append("text")
      .attr("class", "graph-node-label")
      .attr("x", gp.x * W).attr("y", gp.y * H - 70)
      .attr("text-anchor", "middle")
      .style("font-size", "10px").style("letter-spacing", "0.15em").style("text-transform", "uppercase")
      .style("fill", "var(--ink-muted)").style("opacity", 0.45)
      .text(gp.label);
  });

  const link = g.selectAll(".graph-link").data(edges).join("line")
    .attr("class", "graph-link")
    .attr("stroke", "var(--ink-muted)")
    .attr("stroke-width", 0.4)
    .attr("opacity", 0.06);

  const node = g.selectAll(".graph-node-g").data(nodes, d => d.id).join("g")
    .attr("class", "graph-node")
    .attr("data-id", d => d.id)
    .call(d3.drag()
      .on("start", (ev, d) => { if (!ev.active) graphSim.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
      .on("drag", (ev, d) => { d.fx = ev.x; d.fy = ev.y; })
      .on("end", (ev, d) => { if (!ev.active) graphSim.alphaTarget(0); d.fx = null; d.fy = null; })
    );

  const degree = new Map();
  edges.forEach(e => {
    const s = typeof e.source === "object" ? e.source.id : e.source;
    const t = typeof e.target === "object" ? e.target.id : e.target;
    degree.set(s, (degree.get(s) || 0) + (e.count || 1));
    degree.set(t, (degree.get(t) || 0) + (e.count || 1));
  });
  const maxDeg = Math.max(...degree.values(), 1);

  node.each(function(d) {
    const el = d3.select(this);
    const deg = degree.get(d.id) || 1;
    const r = 2 + Math.pow(deg / maxDeg, 0.5) * 12;
    d._r = r;
    const TYPE_ICONS = { person: "👤", company: "🏢", decision: "⚖️", insight: "💡", signal: "📡", pattern: "🔁", strategy: "🎯", framework: "🧩" };
    el.append("circle").attr("r", r).attr("fill", TYPE_COLORS[d.type] || "#999").attr("opacity", 0.8);
    if (r > 5) {
      el.append("text").attr("text-anchor", "middle").attr("dominant-baseline", "central")
        .style("font-size", Math.max(r * 0.9, 8) + "px").style("pointer-events", "none")
        .text(TYPE_ICONS[d.type] || "");
    }
    if (r > 6) {
      el.append("text").attr("class", "graph-node-label").attr("y", r + 10)
        .attr("text-anchor", "middle").style("font-size", "9px")
        .text(d.label.length > 20 ? d.label.slice(0, 18) + "..." : d.label);
    }
  });

  const canvas = container;

  node.on("mouseenter", (ev, d) => {
    canvas.classList.add("has-hover");
    const connected = new Set();
    link.each(function(e) {
      const s = e.source.id ?? e.source, t = e.target.id ?? e.target;
      if (s === d.id) connected.add(t);
      if (t === d.id) connected.add(s);
    });
    node.style("opacity", n => n.id === d.id || connected.has(n.id) ? 1 : 0.08);
    link.style("opacity", e => {
      const s = e.source.id ?? e.source, t = e.target.id ?? e.target;
      return (s === d.id || t === d.id) ? 0.6 : 0.02;
    }).style("stroke-width", e => {
      const s = e.source.id ?? e.source, t = e.target.id ?? e.target;
      return (s === d.id || t === d.id) ? 2 : 0.5;
    });
  });
  node.on("mouseleave", () => {
    if (!state.graphFocus) {
      canvas.classList.remove("has-hover");
      node.style("opacity", 0.85);
      link.style("opacity", d => 0.08 + (d.strength || 0) * 0.15).style("stroke-width", 0.5);
    }
  });
  function mountPanelListeners() {
    document.querySelectorAll(".fact-item[data-fact-id]").forEach(el => {
      el.addEventListener("mouseenter", () => {
        const fid = el.dataset.factId;
        if (!fid) return;
        canvas.classList.add("has-hover");
        const matchNodes = new Set();
        nodes.forEach(n => { if ((n.facts || []).some(f => f.id === fid)) matchNodes.add(n.id); });
        node.style("opacity", n => matchNodes.has(n.id) ? 1 : 0.08);
        link.style("opacity", e => {
          const s = e.source.id ?? e.source, t = e.target.id ?? e.target;
          return (matchNodes.has(s) && matchNodes.has(t)) ? 0.6 : 0.02;
        }).style("stroke-width", e => {
          const s = e.source.id ?? e.source, t = e.target.id ?? e.target;
          return (matchNodes.has(s) && matchNodes.has(t)) ? 2 : 0.5;
        });
        el.classList.add("highlighted");
      });
      el.addEventListener("mouseleave", () => {
        el.classList.remove("highlighted");
        canvas.classList.remove("has-hover");
        node.style("opacity", 0.85);
        link.style("opacity", d => 0.08 + (d.strength || 0) * 0.15).style("stroke-width", 0.5);
      });
    });
  }

  node.on("click", (ev, d) => {
    ev.stopPropagation();
    state.graphFocus = d.id;
    document.getElementById("entity-panel").innerHTML = renderEntityPanel(d.id);
    mountPanelListeners();
  });
  svg.on("click", (ev) => {
    if (ev.target === svgEl || ev.target.tagName === "svg") {
      state.graphFocus = null;
      canvas.classList.remove("has-hover");
      node.style("opacity", 0.85);
      link.style("opacity", d => 0.08 + (d.strength || 0) * 0.15).style("stroke-width", 0.5);
      document.getElementById("entity-panel").innerHTML = renderEntityPanel(null);
    }
  });

  document.querySelectorAll(".graph-filter-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const type = btn.dataset.type;
      const nf = new Set(state.graphFilter);
      if (nf.has(type)) nf.delete(type); else nf.add(type);
      if (nf.size >= 8) nf.clear();
      setState({ graphFilter: nf });
    });
  });

  function clusterForce(alpha) {
    nodes.forEach(d => {
      const cp = CLUSTER_POSITIONS[d.type] || { x: 0.5, y: 0.5 };
      const cx = cp.x * W, cy = cp.y * H;
      d.vx += (cx - d.x) * alpha * 0.12;
      d.vy += (cy - d.y) * alpha * 0.12;
    });
  }

  graphSim = d3.forceSimulation(nodes)
    .force("link", d3.forceLink(edges).id(d => d.id).distance(80).strength(d => 0.01 + (d.strength || 0) * 0.05))
    .force("charge", d3.forceManyBody().strength(-80))
    .force("cluster", clusterForce)
    .force("collision", d3.forceCollide().radius(d => (d._r || 3) + 10).strength(1))
    .alphaDecay(0.05)
    .on("tick", () => {
      link
        .attr("x1", d => d.source.x).attr("y1", d => d.source.y)
        .attr("x2", d => d.target.x).attr("y2", d => d.target.y);
      node.attr("transform", d => `translate(${d.x},${d.y})`);
      d3.selectAll(".trace-grad").each(function() {
        const grad = d3.select(this);
        const id = grad.attr("id");
        if (!id || !id.startsWith("tg-")) return;
        const idx = parseInt(id.split("-")[1]);
        if (idx >= tracePath.length - 1) return;
        const fromN = nodes.find(n => n.id === tracePath[idx]);
        const toN = nodes.find(n => n.id === tracePath[idx + 1]);
        if (fromN && toN) { grad.attr("x1", fromN.x).attr("y1", fromN.y).attr("x2", toN.x).attr("y2", toN.y); }
      });
    });

  if (state.graphFocus) document.getElementById("entity-panel").innerHTML = renderEntityPanel(state.graphFocus);
}

     │   ◆     ◆     │

        </div>

function resetDeck() {
  setState({ deckIndex: 0, kept: 0, archived: 0, history: [] });
}

function mountReview() {
  const stage = document.getElementById("deck-stage");
  if (!stage) return;
  const top = stage.querySelector(".deck-card.top");
  if (!top) return;

  const verifyInd = top.querySelector(".swipe-indicator.verify");
  const archiveInd = top.querySelector(".swipe-indicator.archive");

  let startX = 0, startY = 0, currentX = 0, currentY = 0, dragging = false;

  function onStart(clientX, clientY) {
    dragging = true;
    startX = clientX;
    startY = clientY;
    top.classList.add("dragging");
  }

  function onMove(clientX, clientY) {
    if (!dragging) return;
    currentX = clientX - startX;
    currentY = clientY - startY;
    const rot = currentX / 20;
    top.style.transform = `translate(${currentX}px, ${currentY}px) rotate(${rot}deg)`;
    const opacity = Math.min(1, Math.abs(currentX) / 100);
    if (currentX > 0) {
      verifyInd.style.opacity = opacity;
      archiveInd.style.opacity = 0;
    } else if (currentX < 0) {
      archiveInd.style.opacity = opacity;
      verifyInd.style.opacity = 0;
    } else {
      verifyInd.style.opacity = 0;
      archiveInd.style.opacity = 0;
    }
  }

  function onEnd() {
    if (!dragging) return;
    dragging = false;
    top.classList.remove("dragging");
    const threshold = 100;
    if (currentX > threshold) commit("right");
    else if (currentX < -threshold) commit("left");
    else {
      top.style.transform = "";
      verifyInd.style.opacity = 0;
      archiveInd.style.opacity = 0;
    }
    currentX = 0;
    currentY = 0;
  }

  function spawnFX(direction) {
    const fxLayer = document.createElement("div");
    fxLayer.className = "fx-layer";
    const stageRect = stage.getBoundingClientRect();
    const cardRect = top.getBoundingClientRect();
    // origin: center of where the card was
    const originX = cardRect.left - stageRect.left + cardRect.width / 2;
    const originY = cardRect.top - stageRect.top + cardRect.height / 2;

    const COUNT = 28;
    if (direction === "right") {
      // confetti burst — characters fly outward in all directions
      const glyphs = ["◆", "◇", "✦", "✧", "·", "○", "●", "◈"];
      for (let i = 0; i < COUNT; i++) {
        const p = document.createElement("span");
        p.className = "fx-particle confetti";
        p.textContent = glyphs[i % glyphs.length];
        const angle = (Math.PI * 2 * i) / COUNT + (Math.random() - 0.5) * 0.4;
        const distance = 120 + Math.random() * 180;
        const dx = Math.cos(angle) * distance;
        const dy = Math.sin(angle) * distance - 40; // slight upward bias
        const size = 14 + Math.random() * 14;
        const rot = (Math.random() - 0.5) * 540;
        const delay = Math.random() * 120;
        p.style.left = originX + "px";
        p.style.top = originY + "px";
        p.style.fontSize = size + "px";
        p.style.setProperty("--dx", dx + "px");
        p.style.setProperty("--dy", dy + "px");
        p.style.setProperty("--rot", rot + "deg");
        p.style.animationDelay = delay + "ms";
        p.style.opacity = 0;
        fxLayer.appendChild(p);
      }
    } else {
      // flame rise — characters rise from the bottom of the card area, fire palette
      const glyphs = ["▲", "░", "▒", "▓", "◢", "◣", "◤", "◥", "△", "⌃"];
      const firePalette = [
        { c: "#FFD60A", g: "0 0 8px rgba(255, 214, 10, 0.85), 0 0 18px rgba(255, 140, 0, 0.55)" },
        { c: "#FF8C42", g: "0 0 8px rgba(255, 140, 66, 0.85), 0 0 18px rgba(255, 80, 0, 0.55)" },
        { c: "#FF6B35", g: "0 0 8px rgba(255, 107, 53, 0.85), 0 0 18px rgba(230, 50, 0, 0.55)" },
        { c: "#FF3B30", g: "0 0 8px rgba(255, 59, 48, 0.85), 0 0 18px rgba(200, 30, 0, 0.55)" },
        { c: "#E63946", g: "0 0 8px rgba(230, 57, 70, 0.85), 0 0 18px rgba(180, 20, 0, 0.55)" },
      ];
      for (let i = 0; i < COUNT; i++) {
        const p = document.createElement("span");
        p.className = "fx-particle flame";
        p.textContent = glyphs[i % glyphs.length];
        const hue = firePalette[Math.floor(Math.random() * firePalette.length)];
        p.style.color = hue.c;
        p.style.textShadow = hue.g;
        const lateralOffset = (Math.random() - 0.5) * cardRect.width * 0.9;
        const startX = originX + lateralOffset;
        // start near bottom of card
        const startY = cardRect.bottom - stageRect.top - 20 + (Math.random() * 40);
        const dx = lateralOffset * 0.3 + (Math.random() - 0.5) * 60;
        const dy = -(160 + Math.random() * 220);
        const size = 16 + Math.random() * 16;
        const endScale = 0.4 + Math.random() * 0.5;
        const delay = Math.random() * 200;
        p.style.left = startX + "px";
        p.style.top = startY + "px";
        p.style.fontSize = size + "px";
        p.style.setProperty("--dx", dx + "px");
        p.style.setProperty("--dy", dy + "px");
        p.style.setProperty("--end-scale", endScale);
        p.style.animationDelay = delay + "ms";
        p.style.opacity = 0;
        fxLayer.appendChild(p);
      }
    }
    stage.appendChild(fxLayer);
    // cleanup — wait until longest animation (flame at 1600ms + max delay ~200ms) completes
    setTimeout(() => { if (fxLayer.parentNode) fxLayer.parentNode.removeChild(fxLayer); }, 2000);
  }

  function commit(direction) {
    if (top.classList.contains("gone-right") || top.classList.contains("gone-left")) return; // guard double-fire
    spawnFX(direction);
    top.classList.add(direction === "right" ? "gone-right" : "gone-left");
    setTimeout(() => {
      const newHistory = [...state.history, { direction, deckIndex: state.deckIndex }];
      if (direction === "right") {
        setState({ deckIndex: state.deckIndex + 1, kept: state.kept + 1, history: newHistory });
      } else {
        setState({ deckIndex: state.deckIndex + 1, archived: state.archived + 1, history: newHistory });
      }
    }, 700);
  }

  // pointer events
  top.addEventListener("mousedown", e => { e.preventDefault(); onStart(e.clientX, e.clientY); });
  window.addEventListener("mousemove", e => onMove(e.clientX, e.clientY));
  window.addEventListener("mouseup", onEnd);
  top.addEventListener("touchstart", e => {
    const t = e.touches[0];
    onStart(t.clientX, t.clientY);
  }, { passive: true });
  window.addEventListener("touchmove", e => {
    if (!dragging) return;
    const t = e.touches[0];
    onMove(t.clientX, t.clientY);
  }, { passive: true });
  window.addEventListener("touchend", onEnd);

  // button controls
  const btnVerify = document.getElementById("btn-verify");
  const btnArchive = document.getElementById("btn-archive");
  const btnUndo = document.getElementById("btn-undo");
  if (btnVerify) btnVerify.addEventListener("click", () => commit("right"));
  if (btnArchive) btnArchive.addEventListener("click", () => commit("left"));
  if (btnUndo) btnUndo.addEventListener("click", () => undoSwipe());

  // keyboard — replace any existing handler first
  if (window._deckKeyHandler) {
    document.removeEventListener("keydown", window._deckKeyHandler);
  }
  const keyHandler = e => {
    if (state.mode !== "review") return;
    if ((e.metaKey || e.ctrlKey) && (e.key === "z" || e.key === "Z")) {
      e.preventDefault();
      undoSwipe();
      return;
    }
    if (e.key === "ArrowRight") { e.preventDefault(); commit("right"); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); commit("left"); }
  };
  window._deckKeyHandler = keyHandler;
  document.addEventListener("keydown", keyHandler);
}

function undoSwipe() {
  if (!state.history || state.history.length === 0) return;
  const last = state.history[state.history.length - 1];
  const newHistory = state.history.slice(0, -1);
  const wasVerify = last.direction === "right";

  // re-render with restored index first, then animate the returning card
  setState({
    deckIndex: last.deckIndex,
    kept: wasVerify ? Math.max(0, state.kept - 1) : state.kept,
    archived: !wasVerify ? Math.max(0, state.archived - 1) : state.archived,
    history: newHistory
  });

  // after re-render, animate the new top card flying back from off-screen
  requestAnimationFrame(() => {
    const stage = document.getElementById("deck-stage");
    if (!stage) return;
    const top = stage.querySelector(".deck-card.top");
    if (!top) return;
    // start position: off-screen on the side the swipe went
    const startTransform = wasVerify
      ? "translateX(150vw) rotate(20deg)"
      : "translateX(-150vw) rotate(-20deg)";
    top.style.transition = "none";
    top.style.transform = startTransform;
    top.style.opacity = "0";
    // force layout flush
    top.getBoundingClientRect();
    top.classList.add("returning");
    requestAnimationFrame(() => {
      top.style.transform = "";
      top.style.opacity = "1";
      setTimeout(() => {
        top.classList.remove("returning");
        top.style.transition = "";
      }, 400);
    });
  });
}

/* ─── init ─── */
render();

/* ─── live data: replace SEED_DECK with rows from /api/deck ─── */
fetch("/api/deck")
  .then(r => r.ok ? r.json() : null)
  .then(data => {
    if (!data || !Array.isArray(data.cards) || data.cards.length === 0) return;
    SEED_DECK.length = 0;
    SEED_DECK.push(...data.cards);
    if (state.mode === "home" || state.mode === "review") render();
  })
  .catch(() => { /* keep seed deck on failure */ });
</script>

<script type="module">
// ElevenLabs Agents SDK bridge — exposes window.CerebroEL for the inline script.
// Loaded as an ES module from esm.sh; falls back gracefully if offline.
try {
  // livekit-client must be pinned to ≤2.18.0 — newer versions bundle a
  // publisher SDP offer in JoinRequest that ElevenLabs' LiveKit server
  // (v1.9.0, protocol 16) silently drops, causing negotiation to time out.
  // See https://github.com/elevenlabs/packages/issues/781
  const { Conversation } = await import(
    "https://esm.sh/@elevenlabs/client@1.7.0?deps=livekit-client@2.16.1"
  );
  const AGENT_ID = "agent_5401krsnx55xfcprbgf1j49y1a9q";
  let active = null;

  async function endActive() {
    if (!active) return;
    try { await active.endSession(); } catch {}
    active = null;
  }

  function normalize(msg) {
    if (typeof msg === "string") return msg;
    if (msg && typeof msg === "object") return msg.message ?? msg.text ?? JSON.stringify(msg);
    return String(msg);
  }

  window.CerebroEL = {
    endActive,

    async startTextChat(question, cb = {}) {
      await endActive();
      let assembled = "";
      try {
        active = await Conversation.startSession({
          agentId: AGENT_ID,
          textOnly: true,
          onMessage: ({ source, message }) => {
            if (source === "ai") {
              assembled = message;
              cb.onMessage?.(message);
            }
          },
          onDisconnect: () => cb.onEnd?.(assembled),
          onError: (m) => cb.onError?.(normalize(m)),
        });
        setTimeout(() => {
          try { active?.sendUserMessage(question); }
          catch (e) { cb.onError?.(normalize(e)); }
        }, 400);
      } catch (e) {
        cb.onError?.(normalize(e));
      }
    },

    async startVoiceChat(cb = {}) {
      await endActive();
      try {
        active = await Conversation.startSession({
          agentId: AGENT_ID,
          onConnect: () => cb.onStatus?.("connected"),
          onMessage: ({ source, message }) => {
            const who = source === "ai" ? "ai" : "user";
            cb.onMessage?.(who, message);
          },
          onModeChange: ({ mode }) => cb.onStatus?.(mode),
          onDisconnect: () => cb.onStatus?.("ended"),
          onError: (m) => cb.onError?.(normalize(m)),
        });
      } catch (e) {
        cb.onError?.(normalize(e));
      }
    },
  };
} catch (e) {
  console.error("Failed to load @elevenlabs/client:", e);
}
</script>

<script type="module">
// LiveAvatar SDK bridge — exposes window.CerebroAvatar for the avatar mode.
// LITE-mode session: backend mints a session_token, SDK joins LiveKit room,
// audio I/O is orchestrated by ElevenLabs Agent on the LiveAvatar side.
try {
  const { ElevenLabsAgentSession, SessionEvent, AgentEventsEnum, SessionState } =
    await import("https://esm.sh/@heygen/liveavatar-web-sdk@0.0.18");

  let active = null;

  window.CerebroAvatar = {
    async start(videoEl, cb = {}) {
      if (active) return;
      // Build an absolute URL — relative paths fail when the page is loaded
      // as file:// (e.g., Claude Code preview). Falls back to the dev server.
      const isHttp = location.protocol === "http:" || location.protocol === "https:";
      const origin = isHttp ? location.origin : "http://localhost:3000";
      const tokenUrl = `${origin}/api/liveavatar/session-token`;
      let resp;
      try {
        resp = await fetch(tokenUrl, { method: "POST" });
      } catch (e) {
        throw new Error(
          isHttp
            ? `network: ${e.message || e}`
            : "Open the page via the Next.js dev server (npm run dev → http://localhost:3000/cerebro.html). The preview can't call the API route."
        );
      }
      if (!resp.ok) {
        const err = await resp.json().catch(() => ({}));
        throw new Error(err.error || `session-token HTTP ${resp.status}`);
      }
      const { session_token } = await resp.json();

      active = new ElevenLabsAgentSession(session_token, { voiceChat: true });

      active.on(SessionEvent.SESSION_STATE_CHANGED, (s) => {
        if (s === SessionState.CONNECTING) cb.onStatus?.("connecting…");
        else if (s === SessionState.CONNECTED) cb.onStatus?.("listening…");
        else if (s === SessionState.DISCONNECTED) cb.onStatus?.("ended");
      });
      active.on(SessionEvent.SESSION_STREAM_READY, () => {
        try { active.attach(videoEl); } catch (e) { cb.onError?.(String(e)); }
      });
      active.on(AgentEventsEnum.USER_TRANSCRIPTION, (ev) => {
        if (ev?.text) cb.onUserTranscript?.(ev.text);
      });
      active.on(AgentEventsEnum.AVATAR_TRANSCRIPTION, (ev) => {
        if (ev?.text) cb.onAvatarTranscript?.(ev.text);
      });
      active.on(AgentEventsEnum.AVATAR_SPEAK_STARTED, () => cb.onStatus?.("speaking…"));
      active.on(AgentEventsEnum.AVATAR_SPEAK_ENDED, () => cb.onStatus?.("listening…"));
      active.on(SessionEvent.SESSION_DISCONNECTED, () => { active = null; cb.onStatus?.("ended"); });

      try {
        await active.start();
      } catch (e) {
        console.error("[CerebroAvatar] start() failed:", e);
        const detail = [
          e?.message,
          e?.status != null ? `status=${e.status}` : null,
          e?.errorCode != null ? `code=${e.errorCode}` : null,
        ].filter(Boolean).join(" ");
        active = null;
        throw new Error(detail || "session start failed");
      }
    },

    async stop() {
      if (!active) return;
      try { await active.stop(); } catch {}
      active = null;
    },
  };
} catch (e) {
  console.error("Failed to load @heygen/liveavatar-web-sdk:", e);
}
</script>
